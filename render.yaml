services:
  - type: web
    name: ionos-7
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: AI_ENABLED
        value: "true"
      - key: ENABLE_WEB_SEARCH
        value: "true"

services:
  - type: web
    name: aurealis-infinity
    runtime: static
    buildCommand: ""
    staticPublishPath: ./aurealis-infinity/public
    autoDeploy: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

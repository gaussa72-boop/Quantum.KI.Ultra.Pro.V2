<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#09090b">
<title>Quantum KI Ultra Pro V2</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#171719;--line:#303034;--text:#f4f4f5;--muted:#a1a1aa;--violet:#9b6cff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;overflow-x:hidden}.app{min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;min-height:76px;padding:10px clamp(14px,3vw,36px);border-bottom:1px solid #27272a;overflow-x:auto;scrollbar-width:none}.top::-webkit-scrollbar{display:none}
.brand{font-weight:750;line-height:1.2;letter-spacing:.2px;min-width:150px;font-size:17px}.badge{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:#c4c4cc;max-width:190px}.engine{flex:0 0 auto;border:1px solid #38383f;background:var(--panel);border-radius:14px;padding:12px 16px;color:#eee;text-decoration:none;line-height:1.25}.model{flex:0 0 auto;border:1px solid var(--violet);border-radius:999px;background:transparent;color:#eee;padding:11px 16px;max-width:280px}
.spacer{flex:1;min-width:4px}.main{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;padding:clamp(70px,17vh,190px) 18px 24px}.hero{text-align:center;width:100%;max-width:850px}.hero h1{font-size:clamp(32px,6vw,58px);line-height:1.12;letter-spacing:-1.5px;margin:0 0 22px;font-weight:700}.hero p{margin:0;color:var(--muted);font-size:clamp(14px,2.2vw,20px);line-height:1.5}
.composer-wrap{width:min(780px,100%);margin-top:clamp(90px,19vh,210px)}.composer{display:flex;gap:10px;align-items:center;border:1px solid #3f3f46;background:#151517;border-radius:24px;padding:12px 14px;box-shadow:0 10px 35px #0003}.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:10px 4px}.composer input::placeholder{color:#8c8c96}.send{border:0;border-radius:50%;width:44px;height:44px;background:#eee;color:#111;font-size:22px;cursor:pointer;flex:0 0 auto}.send:disabled{opacity:.5}.status{min-height:24px;margin:12px 10px;color:var(--muted);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.footer{color:#71717a;text-align:center;font-size:12px;padding:0 16px 18px}
@media(max-width:600px){.top{gap:8px;min-height:70px;padding:8px 12px}.brand{min-width:118px;font-size:14px}.badge{font-size:12px;padding:7px 9px;max-width:145px;white-space:normal}.engine{font-size:13px;padding:10px 12px}.model{font-size:13px;padding:10px 13px;max-width:230px}.main{padding:clamp(95px,22vh,230px) 18px 20px}.hero h1{letter-spacing:-.8px}.composer-wrap{margin-top:clamp(100px,20vh,220px)}.composer{border-radius:20px;padding:8px 10px;gap:6px}.composer input{font-size:15px}.send{width:40px;height:40px}}
</style>

<style id="ultima-2026-layer">
:root{color-scheme:dark;--bg:#08090f;--panel:rgba(20,22,34,.78);--line:rgba(176,155,255,.18);--text:#f7f5ff;--muted:#aaa8bd;--violet:#a78bfa;--cyan:#67e8f9;--gold:#e9c77b}
html{scroll-behavior:smooth;background:var(--bg)}body{background:radial-gradient(ellipse at 50% -20%,rgba(113,75,220,.24),transparent 55%),radial-gradient(ellipse at 100% 40%,rgba(30,155,190,.09),transparent 42%),var(--bg);color:var(--text)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.2;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 80%)}
.app,.top,.main{position:relative;z-index:1}.top{background:rgba(8,9,15,.76);backdrop-filter:blur(22px);border-bottom:1px solid var(--line);box-shadow:0 12px 40px #0002}.brand{letter-spacing:-.35px}.badge{background:rgba(255,255,255,.035);border-color:var(--line);color:#d4cafa}.engine{background:linear-gradient(135deg,rgba(167,139,250,.14),rgba(103,232,249,.055));border-color:var(--line);border-radius:14px;transition:transform .2s,border-color .2s,background .2s}.engine:hover{transform:translateY(-2px);border-color:rgba(167,139,250,.55);background:rgba(167,139,250,.16)}.model{border-color:rgba(167,139,250,.5);background:rgba(167,139,250,.09);box-shadow:inset 0 0 18px rgba(167,139,250,.06)}
.main{padding-top:clamp(76px,15vh,170px)}.hero h1{letter-spacing:-2.3px;background:linear-gradient(100deg,#fff 15%,#d9caff 56%,#8eeafa);background-clip:text;-webkit-background-clip:text;color:transparent;text-wrap:balance;text-shadow:0 10px 50px rgba(167,139,250,.08)}.hero p{max-width:690px;margin-inline:auto;color:#b9b6ca;text-wrap:balance}.composer-wrap{margin-top:clamp(64px,14vh,150px)}.composer{background:rgba(19,20,31,.82);border:1px solid rgba(177,159,255,.25);border-radius:26px;padding:13px 15px;backdrop-filter:blur(24px);box-shadow:0 22px 70px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.055);transition:border-color .2s,box-shadow .2s}.composer:focus-within{border-color:rgba(167,139,250,.72);box-shadow:0 22px 70px rgba(0,0,0,.42),0 0 0 4px rgba(167,139,250,.09)}.composer input{font-size:16px}.composer input::placeholder{color:#85839b}.send{background:linear-gradient(135deg,#a78bfa,#6c63d9);color:#fff;box-shadow:0 6px 22px rgba(124,94,226,.35);transition:transform .18s,filter .18s}.send:hover{transform:translateY(-2px);filter:brightness(1.12)}button,a,input,textarea,select{font-family:inherit}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
@media(max-width:640px){.top{min-height:64px;gap:8px;padding-inline:12px}.brand{font-size:15px;min-width:125px}.badge{font-size:12px;padding:7px 9px}.engine{font-size:13px;padding:10px 11px}.main{padding-top:clamp(66px,12vh,110px)}.hero h1{letter-spacing:-1.3px}.composer-wrap{margin-top:clamp(58px,12vh,100px)}.composer{border-radius:21px;padding:9px 10px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body><div class="app">
<header class="top">
  <div class="brand">QUANTUM KI ULTRA PRO V2</div>
  <div class="badge">GPT-6 Astra · High reasoning</div>
  <a class="engine" href="/engine">Game Engine<br>→</a>
  <div class="spacer"></div>
  <select class="model" id="ai-model-select" aria-label="KI-Modell wählen"><option value="">Server-Modell wird geladen …</option></select>
</header>
<main class="main">
  <section class="hero"><h1>Wie kann ich helfen?</h1><p>Recherche · Reasoning · Coding · Projekte · Game Development</p></section>
  <section class="composer-wrap" aria-label="Chat">
    <form class="composer" id="form"><input id="q" placeholder="Schreibe deine Nachricht an Quantum KI …" autocomplete="off" aria-label="Nachricht"><button class="send" id="send" type="submit" aria-label="Nachricht senden">↑</button></form>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>
</main>
<footer class="footer">Quantum KI Ultra Pro V2</footer>
</div>
<script>
const form=document.getElementById('form'),input=document.getElementById('q'),status=document.getElementById('status'),sendButton=document.getElementById('send'),modelSelect=document.getElementById('ai-model-select');
fetch('/health',{cache:'no-store'}).then(r=>r.json()).then(x=>{modelSelect.innerHTML='';(x.models||[]).forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=(m.provider==='openrouter'?'OpenRouter':'OpenAI')+' · '+m.id;modelSelect.appendChild(o)});if(!modelSelect.options.length){const o=document.createElement('option');o.value='';o.textContent='API-Key in Render konfigurieren';modelSelect.appendChild(o);modelSelect.disabled=true}document.querySelector('.badge').textContent=x.openai_configured?'KI verbunden · '+x.model:'KI-API nicht konfiguriert'}).catch(()=>{document.querySelector('.badge').textContent='KI-Status nicht verfügbar'});
form.addEventListener('submit',async event=>{event.preventDefault();const message=input.value.trim();if(!message)return;input.value='';status.textContent='Quantum KI denkt nach …';sendButton.disabled=true;try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,model:modelSelect.value,history:[]})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Die Anfrage ist fehlgeschlagen.');status.textContent=data.reply||data.response||data.error||'Keine Antwort erhalten.';}catch(error){status.textContent=error.message||'Verbindung fehlgeschlagen. Bitte Backend und API-Konfiguration prüfen.';}finally{sendButton.disabled=false;input.focus();}});
</script>

<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050611"><title>Konto · Quantum KI Ultra Pro V2</title>
<style>
:root{color-scheme:dark;--gold:#f6d58a;--line:#ffffff22}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:#f7f4ff;font:15px system-ui;background:radial-gradient(ellipse at 75% 20%,#45207170,transparent 38%),radial-gradient(ellipse at 20% 75%,#143e7660,transparent 42%),#050611}.card{width:min(520px,92vw);padding:28px;border:1px solid #e6c06d55;border-radius:20px;background:#080a19e8;box-shadow:0 20px 70px #0008}.brand{font:24px Georgia,serif;color:var(--gold);letter-spacing:1.5px}.muted{color:#aaa8c8;font-size:13px}button{padding:12px 18px;border:0;border-radius:10px;background:linear-gradient(120deg,#f6d58a,#b68cff);color:#111;font-weight:800}a{color:#e8cc8c}#msg{white-space:pre-wrap;color:#ffc5c5;font-size:13px}
</style></head><body><main class="card"><div class="brand">QUANTUM KI</div><h1>Dein Konto</h1><p class="muted">Angemeldete Sitzung</p><div id="profile">Profil wird geladen…</div><p id="msg" role="status"></p><button id="logout">Abmelden</button><p><a href="/">Zur KI</a> · <a href="/engine">Game Engine</a></p></main><script>
const token=sessionStorage.getItem("quantumBearer"),profile=document.getElementById("profile"),msg=document.getElementById("msg");if(!token){location.href="/login"}else{fetch("/api/auth/me",{headers:{Authorization:"Bearer "+token}}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||"Sitzung abgelaufen");profile.textContent=d.user.username+" · "+d.user.email}).catch(e=>{msg.textContent=e.message;sessionStorage.removeItem("quantumBearer");setTimeout(()=>location.href="/login",800)})}document.getElementById("logout").addEventListener("click",async()=>{try{await fetch("/api/auth/logout",{method:"POST",headers:{Authorization:"Bearer "+(token||"")}})}finally{sessionStorage.removeItem("quantumBearer");location.href="/login"}});
</script></body></html>

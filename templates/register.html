<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050611"><title>Registrieren · Quantum KI Ultra Pro V2</title>
<style>
:root{color-scheme:dark;--gold:#f6d58a;--line:#ffffff22}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:#f7f4ff;font:15px system-ui;background:radial-gradient(ellipse at 75% 20%,#45207170,transparent 38%),radial-gradient(ellipse at 20% 75%,#143e7660,transparent 42%),#050611}.card{width:min(460px,92vw);padding:28px;border:1px solid #e6c06d55;border-radius:20px;background:#080a19e8;box-shadow:0 20px 70px #0008}.brand{font:24px Georgia,serif;color:var(--gold);letter-spacing:1.5px}.muted{color:#aaa8c8;font-size:13px}label{display:block;margin:13px 0 7px;color:#e8d9b4;font-size:12px}input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#ffffff08;color:#fff;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:linear-gradient(120deg,#f6d58a,#b68cff);color:#111;font-weight:800;font-size:14px}a{color:#e8cc8c}#msg{white-space:pre-wrap;color:#ffc5c5;font-size:13px;margin-top:12px}
</style></head><body><main class="card"><div class="brand">QUANTUM KI</div><h1>Konto erstellen</h1><p class="muted">Verwende ein Passwort mit mindestens 12 Zeichen.</p><form id="form"><label for="username">Benutzername</label><input id="username" autocomplete="username" minlength="3" maxlength="40" required><label for="email">E-Mail</label><input id="email" type="email" autocomplete="email" maxlength="254" required><label for="password">Passwort</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><button type="submit">Konto erstellen</button></form><div id="msg" role="status"></div><p class="muted">Schon registriert? <a href="/login">Anmelden</a></p><p><a href="/">← Zur KI</a></p></main><script>
const form=document.getElementById("form"),msg=document.getElementById("msg");form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="Konto wird erstellt…";try{const r=await fetch("/api/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,email:document.getElementById("email").value,password:document.getElementById("password").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Registrierung fehlgeschlagen");location.href="/login"}catch(err){msg.textContent=err.message}});
</script></body></html>

<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050611"><title>Anmelden · Quantum KI Ultra Pro V2</title>
<style>
:root{color-scheme:dark;--gold:#f6d58a;--violet:#9a78ff;--line:#ffffff22}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:#f7f4ff;font:15px system-ui;background:radial-gradient(ellipse at 75% 20%,#45207170,transparent 38%),radial-gradient(ellipse at 20% 75%,#143e7660,transparent 42%),#050611}.card{width:min(440px,92vw);padding:28px;border:1px solid #e6c06d55;border-radius:20px;background:#080a19e8;box-shadow:0 20px 70px #0008}.brand{font:24px Georgia,serif;color:var(--gold);letter-spacing:1.5px}.muted{color:#aaa8c8;font-size:13px}label{display:block;margin:15px 0 7px;color:#e8d9b4;font-size:12px}input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#ffffff08;color:#fff;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:linear-gradient(120deg,#f6d58a,#b68cff);color:#111;font-weight:800;font-size:14px}a{color:#e8cc8c}#msg{white-space:pre-wrap;color:#ffc5c5;font-size:13px;margin-top:12px}
</style></head><body><main class="card"><div class="brand">QUANTUM KI</div><h1>Anmelden</h1><p class="muted">Melde dich bei deinem Quantum-Konto an.</p><form id="form"><label for="identifier">Benutzername oder E-Mail</label><input id="identifier" autocomplete="username" required><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sicher anmelden</button></form><div id="msg" role="status"></div><p class="muted">Noch kein Konto? <a href="/register">Registrieren</a></p><p><a href="/">← Zur KI</a></p></main><script>
const form=document.getElementById("form"),msg=document.getElementById("msg");form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="Anmeldung läuft…";try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identifier:document.getElementById("identifier").value,password:document.getElementById("password").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Anmeldung fehlgeschlagen");sessionStorage.setItem("quantumBearer",d.token);location.href="/dashboard"}catch(err){msg.textContent=err.message}});
</script></body></html>
